<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="2" y="2" width="96" height="96" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Outer ring glow -->
  <rect x="5" y="5" width="90" height="90" rx="25" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Cat Ears -->
  <polygon points="26,38 18,18 42,28" fill="#f472b6"/>
  <polygon points="28,36 22,22 40,29" fill="#fbcfe8"/>

  <polygon points="74,38 82,18 58,28" fill="#f472b6"/>
  <polygon points="72,36 78,22 60,29" fill="#fbcfe8"/>

  <!-- Cat Face Base -->
  <ellipse cx="50" cy="56" rx="32" ry="26" fill="url(#catGrad)" filter="url(#shadow)"/>

  <!-- Eyes -->
  <ellipse cx="38" cy="50" rx="5.5" ry="7" fill="#1e1b4b"/>
  <ellipse cx="62" cy="50" rx="5.5" ry="7" fill="#1e1b4b"/>
  <!-- Eye highlights -->
  <circle cx="36.5" cy="48" r="2.2" fill="#ffffff"/>
  <circle cx="60.5" cy="48" r="2.2" fill="#ffffff"/>
  <circle cx="40" cy="52" r="1.2" fill="#ffffff"/>
  <circle cx="64" cy="52" r="1.2" fill="#ffffff"/>

  <!-- Cute Cheeks -->
  <ellipse cx="30" cy="58" rx="4" ry="2.5" fill="#f472b6" opacity="0.6"/>
  <ellipse cx="70" cy="58" rx="4" ry="2.5" fill="#f472b6" opacity="0.6"/>

  <!-- Nose -->
  <polygon points="50,56 46,53 54,53" fill="#ec4899" rx="1"/>

  <!-- Mouth -->
  <path d="M 46,59 Q 50,63 54,59" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>

  <!-- Crown on Top -->
  <polygon points="34,26 42,16 50,23 58,16 66,26" fill="url(#crownGrad)" stroke="#b45309" stroke-width="1"/>
  <circle cx="34" cy="26" r="2" fill="#ef4444"/>
  <circle cx="50" cy="23" r="2" fill="#3b82f6"/>
  <circle cx="66" cy="26" r="2" fill="#ef4444"/>

  <!-- Tiny Paw Print Badge in corner -->
  <g transform="translate(68,68) scale(0.6)">
    <ellipse cx="12" cy="14" rx="5" ry="4" fill="#9333ea"/>
    <circle cx="5" cy="7" r="2.2" fill="#9333ea"/>
    <circle cx="10" cy="5" r="2.2" fill="#9333ea"/>
    <circle cx="15" cy="5" r="2.2" fill="#9333ea"/>
    <circle cx="19" cy="8" r="2.2" fill="#9333ea"/>
  </g>
</svg>
